name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Lint and formatting
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (actions/checkout)
        uses: actions/checkout@v7

      - name: Set up Node.js (actions/setup-node)
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint with ESLint
        run: npm run lint

      - name: Check formatting with Prettier
        run: npm run format:check

  # Unit and integration tests against the in-process OpenRouter mock
  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout (actions/checkout)
        uses: actions/checkout@v7

      - name: Set up Node.js (actions/setup-node)
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # Build the image and keep it as an artifact for the API smoke test
  docker-build:
    name: Build image
    runs-on: ubuntu-latest
    needs: [unit-test]
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout (actions/checkout)
        uses: actions/checkout@v7

      - name: Set up Docker Buildx (docker/setup-buildx-action)
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: openrouter-image-mcp:build
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/openrouter-image-mcp.tar

      - name: Upload image artifact (actions/upload-artifact)
        uses: actions/upload-artifact@v7
        with:
          name: openrouter-image-mcp-${{ github.sha }}
          path: /tmp/openrouter-image-mcp.tar
          retention-days: 1

  # Run the built image against the mock OpenRouter API
  api-test:
    name: Container smoke test
    runs-on: ubuntu-latest
    needs: [docker-build]
    permissions:
      contents: read
    steps:
      - name: Checkout (actions/checkout)
        uses: actions/checkout@v7

      - name: Set up Node.js (actions/setup-node)
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download image artifact (actions/download-artifact)
        uses: actions/download-artifact@v8
        with:
          name: openrouter-image-mcp-${{ github.sha }}
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/openrouter-image-mcp.tar

      - name: Start mock OpenRouter and container
        run: |
          set -euo pipefail
          node scripts/mock-openrouter.js >/tmp/mock.log 2>&1 &
          echo $! >/tmp/mock.pid
          docker run -d --name openrouter-image-mcp-ci --network host \
            -e HOST=0.0.0.0 \
            -e PORT=3333 \
            -e OPENROUTER_API_BASE_URL=http://127.0.0.1:4010/api/v1 \
            openrouter-image-mcp:build
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3333/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3333/health

      - name: Run MCP smoke test
        run: |
          MCP_URL=http://127.0.0.1:3333/mcp \
          OPENROUTER_API_KEY=test-key \
          node scripts/smoke.js

      - name: Stop container and mock
        if: always()
        run: |
          docker logs openrouter-image-mcp-ci || true
          docker rm -f openrouter-image-mcp-ci || true
          if [ -f /tmp/mock.pid ]; then kill "$(cat /tmp/mock.pid)" || true; fi

  # Publish to GHCR on pushes to main
  deploy-ghcr-io:
    name: Publish image
    runs-on: ubuntu-latest
    needs: [api-test]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - name: Checkout (actions/checkout)
        uses: actions/checkout@v7

      - name: Set up Docker Buildx (docker/setup-buildx-action)
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR (docker/login-action)
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (docker/metadata-action)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
