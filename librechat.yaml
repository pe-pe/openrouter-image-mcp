# LibreChat MCP server configuration snippet.
# Add this under the top-level mcpServers key in your librechat.yaml.
#
# The URL below assumes LibreChat and this server run on the same Docker
# network. For a local (non-Docker) LibreChat, use http://localhost:3333/mcp.
mcpServers:
  openrouter-image:
    type: streamable-http
    url: http://openrouter-image-mcp:3333/mcp
    title: Image Generation
    customUserVars:
      OPENROUTER_API_KEY:
        title: OpenRouter API key
        description: Enter your own OpenRouter API key (sk-or-v1-...).
        sensitive: true
    headers:
      Authorization: 'Bearer {{OPENROUTER_API_KEY}}'

# If LibreChat's SSRF protection is enabled, allow the private host:port.
# Entries use host:port without a scheme.
# mcpSettings:
#   allowedAddresses:
#     - 'openrouter-image-mcp:3333'
